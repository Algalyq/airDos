name: Build and Deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify compose file
        run: docker compose config

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy environment file
        run: cp ~/.env.airdos .env

      - name: Deploy
        run: |
          set -e
          docker compose up --build -d
          docker compose exec -T airdos-web alembic upgrade head
          docker image prune -f
